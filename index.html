<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>AURAWEAR | Move Different</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#a50920;--silver:#c7c9ce}
body{background:#080808;color:white;font-family:'Space Grotesk',sans-serif;overflow-x:hidden}
body.intro-active{overflow:hidden}
html{scroll-behavior:smooth}

/* INTRO */
.intro{
 position:fixed;
 inset:0;
 z-index:1000;
 background:#050505;
 display:flex;
 justify-content:center;
 align-items:center;
 overflow:hidden;
 animation:introOut 1.2s ease 3.2s forwards;
}

.intro-logo-container {
 position: relative;
 animation: introIn 1.4s cubic-bezier(0.16, 1, 0.3, 1);
}

.intro-logo {
 height: clamp(45px, 11vw, 85px);
 width: auto;
 object-fit: contain;
 filter: drop-shadow(0 0 25px rgba(199, 201, 206, 0.4));
 animation: logoPulse 2s ease-in-out infinite alternate;
}

.intro:after{
 content:"";
 position:absolute;
 width:100%;
 height:2px;
 top:50%;
 left:-100%;
 background:#ff2638;
 box-shadow:0 0 20px red,0 0 50px red;
 animation:loadingLine 2s ease-in-out forwards;
}

@keyframes introIn{
 from{opacity:0;transform:scale(.7);filter:blur(15px)}
 to{opacity:1;transform:scale(1);filter:blur(0)}
}

@keyframes logoPulse {
 0% { filter: drop-shadow(0 0 15px rgba(199,201,206,0.3)) brightness(1); }
 100% { filter: drop-shadow(0 0 35px rgba(255,38,56,0.6)) brightness(1.15); }
}

@keyframes loadingLine{
 to{left:100%}
}

@keyframes introOut{
 to{opacity:0;visibility:hidden}
}

/* HEADER */
header{height:75px;padding:0 7%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff18;position:relative;z-index:10}
.logo-img{height:28px;width:auto;object-fit:contain;transition:transform 0.3s ease, filter 0.3s ease;}
.logo-img:hover{transform:scale(1.05);filter:drop-shadow(0 0 10px rgba(255,38,56,0.5));}

nav{display:flex;gap:25px}
nav a{color:#aaa;text-decoration:none;font-size:11px;letter-spacing:2px;transition:color .3s}
nav a:hover{color:#ff2638}

/* HERO */
.hero{min-height:calc(100svh - 75px);position:relative;display:flex;justify-content:center;align-items:center;overflow:hidden;isolation:isolate}

/* SMOKE */
.smoke{
 position:absolute;
 width:800px;
 height:650px;
 border-radius:50%;
 background:
 radial-gradient(ellipse at 30% 50%,
 rgba(200,205,215,.24),
 rgba(130,10,30,.32) 35%,
 rgba(165,9,32,.18) 55%,
 transparent 75%);
 filter:blur(55px);
 opacity:.8;
 z-index:-3;
 pointer-events:none;
 animation:smokeFlow 8s ease-in-out infinite alternate;
}

.smoke.two{
 width:650px;
 height:550px;
 background:
 radial-gradient(ellipse,
 rgba(165,9,32,.35),
 rgba(80,0,15,.25) 45%,
 transparent 75%);
 animation-delay:-4s;
 animation-duration:11s;
}

.smoke.three{
 width:500px;
 height:450px;
 background:
 radial-gradient(ellipse,
 rgba(220,220,230,.22),
 transparent 70%);
 animation-delay:-2s;
 animation-duration:9s;
}

@keyframes smokeFlow{
 0%{transform:translate(-130px,70px) scale(.75) rotate(-12deg);opacity:.25}
 50%{transform:translate(100px,-45px) scale(1.25) rotate(12deg);opacity:.9}
 100%{transform:translate(-20px,65px) scale(1) rotate(-5deg);opacity:.55}
}

/* BACKGROUND BRAND TEXT */
.brand-back{position:absolute;top:43%;left:50%;transform:translate(-50%,-50%);width:100%;text-align:center;font-family:Orbitron;font-size:clamp(60px,13vw,180px);font-weight:900;letter-spacing:-5px;white-space:nowrap;background:linear-gradient(180deg,#fff,#92969e 30%,#f5f5f5 48%,#777b82 70%,#eee);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:.4;z-index:-1;pointer-events:none}

/* MODEL STAGE */
.model-stage{width:100%;height:76vh;min-height:450px;display:flex;justify-content:center;align-items:center;perspective:1200px;position:relative}
.model{width:min(470px,85vw);height:100%;display:flex;justify-content:center;align-items:center;transform-style:preserve-3d;animation:modelRotate 7s ease-in-out infinite;transition:transform 0.15s ease-out}
.model img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 20px 40px #000)}

/* SAMPLE HOODIE IF IMAGE MISSING */
.sample{width:270px;height:390px;position:relative;background:linear-gradient(145deg,#333,#090909 70%);clip-path:polygon(28% 0,40% 8%,60% 8%,72% 0,100% 18%,86% 42%,76% 34%,79% 100%,21% 100%,24% 34%,14% 42%,0 18%);display:flex;align-items:center;justify-content:center;font-family:Orbitron;font-size:35px;color:#bbb;text-shadow:0 0 20px #a50920}
@keyframes modelRotate{0%,100%{transform:rotateY(-13deg) translateX(-12px)}50%{transform:rotateY(13deg) translateX(12px)}}

/* FRONT BRAND LOGO BADGE */
.brand-front-container {
 position:absolute;
 top:75%;
 left:50%;
 transform:translate(-50%,-50%);
 z-index:3;
 pointer-events:none;
 text-align:center;
}
.brand-front-logo {
 height: clamp(30px, 5vw, 55px);
 width: auto;
 object-fit: contain;
 filter: drop-shadow(0 0 15px #a50920) drop-shadow(0 0 30px rgba(165,9,32,0.5));
 animation: brandLogoShimmer 3s ease-in-out infinite alternate;
}

@keyframes brandLogoShimmer {
 0% { transform: scale(1); filter: drop-shadow(0 0 15px #a50920); }
 100% { transform: scale(1.04); filter: drop-shadow(0 0 25px #ff2638) drop-shadow(0 0 45px rgba(255,38,56,0.7)); }
}

/* RED LIGHT SWEEP */
.red-line{position:absolute;top:50%;left:0;width:0;height:2px;background:#ff2638;box-shadow:0 0 20px red,0 0 45px red;z-index:4;animation:lineMove 5s ease-in-out infinite}
@keyframes lineMove{0%{left:0;width:0}45%{left:0;width:100%}100%{left:100%;width:0}}

/* RED RING */
.ring{position:absolute;width:440px;height:440px;border:1px solid #a5092055;border-radius:50%;animation:ringRotate 15s
